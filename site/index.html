<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot SDK Agent</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6b6b70; --line:#e4e4e7; --ok:#1f7a3a; --bad:#b42318; --card:#f7f7f8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --fg:#ececee; --muted:#9a9aa2; --line:#2c2c31; --ok:#5fd07f; --bad:#ff7b6b; --card:#1c1c20; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:1040px; margin:0 auto; padding:24px 16px 64px; }
  h1 { margin:0 0 4px; font-size:24px; } h2 { font-size:17px; margin:28px 0 8px; }
  .muted { color:var(--muted); } a { color:inherit; }
  .verdict { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:16px 0; }
  .big { font-size:28px; font-weight:650; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; white-space:nowrap; }
  .pass { color:var(--ok); } .fail { color:var(--bad); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Robot SDK Agent</h1>
  <div class="muted">Keeps <a href="https://zacharyyamaoka.github.io/robot_sdk/">robot-sdk</a> a true, current directory. This page reads only <code>ledger.jsonl</code> and <code>status.json</code>. · <a href="https://github.com/zacharyyamaoka/robot_sdk_agent">repo</a> · <a href="https://github.com/zacharyyamaoka/robot_sdk_agent/blob/main/OBJECTIVES.md">objectives &amp; gates</a></div>
  <div class="verdict" id="verdict">Loading…</div>
  <h2>Gates (newest score of each solution)</h2>
  <div class="scroll"><table id="gates"></table></div>
  <h2>Ledger</h2>
  <div class="scroll"><table id="ledger"></table></div>
</main>
<script>
const GATES = ["fresh_24h","lint_clean","graph_true","listed_all","declared_all","links_alive","ci_green","pypi_current","site_current"];
const fmt = v => v === null || v === undefined ? "—" : (typeof v === "number" && !Number.isInteger(v) ? v.toFixed(2) : String(v));
const cell = (tag, text, cls) => { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; };
const row = (cells, tag = "td") => { const tr = document.createElement("tr"); cells.forEach(c => tr.append(typeof c === "object" ? c : cell(tag, c))); return tr; };
Promise.all([fetch("data/ledger.jsonl").then(r => r.text()), fetch("data/status.json").then(r => r.json())]).then(([text, status]) => {
  const rows = text.split("\n").filter(Boolean).map(JSON.parse);
  const k = status.kpi;
  document.getElementById("verdict").innerHTML = "";
  document.getElementById("verdict").append(
    cell("div", `${k.level} · worst staleness ${fmt(k.value)} h (gate ≤ ${k.target} h)`, "big"),
    cell("div", `next gate to win: ${k.next_gate || "none, all pass"} · ${status.todo.open} open ideas`, "muted"));
  const newest = {}; rows.forEach(r => newest[r.solution] = r);
  const g = document.getElementById("gates");
  g.append(row(["solution", "scored", "max stale (h)", ...GATES], "th"));
  Object.values(newest).forEach(r => g.append(row([r.solution, r.t, fmt(r.objective),
    ...GATES.map(name => cell("td", r.gates[name] ? "pass" : "fail", r.gates[name] ? "pass" : "fail"))])));
  const l = document.getElementById("ledger");
  l.append(row(["t", "solution", "directory", "max stale (h)", "lint fails", "unlisted", "undeclared", "dead links", "CI not green", "PyPI behind"], "th"));
  rows.slice().reverse().forEach(r => { const m = r.metrics; l.append(row([r.t, r.solution, r.directory, fmt(r.objective),
    fmt(m.lint_failures), fmt(m.unlisted_repos), fmt(m.undeclared_packages), fmt(m.dead_links), fmt(m.ci_not_green), fmt(m.pypi_mismatch)])); });
}).catch(e => { document.getElementById("verdict").textContent = "Could not load the ledger: " + e; });
</script>
</body>
</html>
